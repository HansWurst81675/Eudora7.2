; DEudora.ini - Vorgaben fuer NEUE Konten, plus die Dateizuordnungen von QUALCOMM
;
; DIESE DATEI IST DIE ORIGINALDATEI VON QUALCOMM MIT VIER ZUSATZZEILEN.
; Der Abschnitt [Mappings] ist unveraendert uebernommen aus
; InstallersForEudora\Eudora7.1\Data\INIfiles\deudora.ini (124 Zuordnungen).
; Grund: paket-bauen.ps1 legt diese Datei ins Paket, und wer das Paket ueber
; eine bestehende Installation auspackt, ersetzt damit seine eigene
; DEudora.ini. Eine Fassung mit nur [Settings] haette die Zuordnungen
; geloescht. Gregor hat seine Datei am 07.09.2026 gezeigt, sonst waere es
; niemandem aufgefallen.
;
; WIE DIE VORGABEN WIRKEN
; Eudora liest diese Datei in GetDefaultIniSetting (Eudora71\Eudora\rs.cpp:357-385)
; und nimmt die Werte hier VOR den eingebauten Vorgaben aus EudoraRes.rc. Den
; Pfad setzt SetupINIFilename (rs.cpp:1359-1368): Verzeichnis der EXE plus
; "DEudora.ini"; fehlt die Datei, bleibt alles beim eingebauten Wert. Die
; Zuordnungen aus [Mappings] liest MIMEMap.cpp:229-245 ZUSAETZLICH zu denen in
; der Eudora.ini des Mailverzeichnisses.
;
; WAS DIESE DATEI NICHT TUT: sie aendert kein vorhandenes Konto. Die Vorgaben
; greifen genau einmal, wenn ein Konto ANGELEGT wird
; (CPersParams::GetDefaultParams, PersParams.cpp:195, gerufen aus
; AccountWizard\Src\WizardPropSheet.cpp:137). Ein vorhandenes Konto steht in
; der Eudora.ini des Mailverzeichnisses, und zwar
;   <Dominant>        im Abschnitt [Settings]      (persona.cpp:897-898)
;   jedes weitere     im Abschnitt [Persona-<Name>] (Praefix persona.cpp:52)
; Dort muss man dieselben Schluessel von Hand setzen.
;
; NC=1 und Code=NC sind Altbestand des Installationsprogramms und ohne
; Wirkung: "NC" kommt im Quelltext nur in mainfrm.cpp:5273 vor, innerhalb
; eines #ifdef COMMENTED_OUT, und "NC=1" gar nicht. Sie bleiben unangetastet.
;
; Angelegt am 07.09.2026 auf Gregors Ansage: "die zwei markierte dinge moechte
; ich als default bei jedem konto. zum testen ist es wichtig, sonst werden die
; mails abgerufen und geloescht, wenn ich nicht dran denke."
[Settings]
NC=1
Code=NC

; --- Von Gregor verlangt ------------------------------------------------------
; "Secure Sockets when Sending" -> "Required, Alternate Port" (SMTP ueber 465).
; Reihenfolge im Auswahlfeld, siehe SSLSettings::SSLUsage in SSLSettings.h:30-36
; und ModifyAcctDlgs.cpp:803-806:
;   0 Never | 1 If Available STARTTLS | 2 Required Alternate Port | 3 Required STARTTLS
; Eingebaute Vorgabe war 1.
SSLSendUse=2
; "Check Mail" angehakt. Der eingebaute Wert ist schon 1; er steht hier
; trotzdem, damit die Vorgabe an einer Stelle nachlesbar ist.
CheckMailByDefault=1

; --- Dasselbe fuer den Abruf --------------------------------------------------
; "Secure Sockets when Receiving" -> "Required, Alternate Port" (POP3 ueber 995).
; Genau diese Einstellung ist der Beleg fuer Kriterium 0 bis 3 in ZIEL.md:
; gemessen am 06.09.2026 gegen mx.freenet.de, TLSv1.3, TLS_AES_256_GCM_SHA384.
SSLReceiveUse=2

; --- Was Gregors Begruendung wirklich trifft ----------------------------------
; "Leave mail on server". OHNE diesen Wert loescht Eudora eine Nachricht auf dem
; Server, sobald sie abgeholt ist - der Fall, den Gregor beschreibt. Die zwei
; Haekchen oben verhindern das NICHT: "Check Mail" schaltet den Abruf ein, die
; SSL-Wahl betrifft nur die Verbindung. Eingebaute Vorgabe ist 0, also loeschen.
; Soll es weg, genuegt ein Semikolon davor.
LeaveMailOnServer=1
; Die beiden Nachbarn, die das Loeschen auf anderen Wegen einschalten wuerden:
;   LeaveOnServerDays  "nach N Tagen vom Server loeschen", 0 = nie
;   ServerDelete       "Delete from server when emptied from Trash"
LeaveOnServerDays=0
ServerDelete=0

; --- Die DRITTE Loeschquelle, und die gefaehrlichste --------------------------
; BEFUND E-74 (10.09.2026). "Delete fetched junk": was Eudora beim Abruf als
; Junk einstuft, wird nicht nur nach Junk verschoben, sondern auf dem SERVER
; zum Loeschen vorgemerkt - CJunkMail::ProcessOne, JunkMail.cpp:453-457.
;
; DIE EINGEBAUTE VORGABE IST 1, ALSO AN. Nachgesehen in EudoraRes.rc:
;     IDS_INI_DELETE_FETCHED_JUNK "DeleteFetchedJunk\n1"
; Sie sticht LeaveMailOnServer nicht - sie ist ein eigener Weg daran vorbei.
;
; WARUM WIR SIE AUSSCHALTEN, und das ist eine bewusste Abweichung vom
; Original: die Junk-Bewertung stuetzt sich auf Zusatzmodule (SpamWatch,
; SpamHeaders), und die sind in dieser Portierung GAR NICHT LADBAR - sie
; brauchen MFC71.DLL und MSVCP71.dll, die Microsoft nie zur Weitergabe
; freigegeben hat (BEFUND E-47). Eine Einstufung, der man nicht trauen kann,
; darf keine Post auf dem Server loeschen. Ab Punktzahl MinScoreToJunk
; (Vorgabe 50) wuerde sie das tun; Nachrichten, die einmal als Junk markiert
; wurden, tragen 100.
;
; Gregor am 10.09.2026, nachdem sein freenet-Postfach leer war: "DeleteFetchedJunk=0".
; Soll es doch an sein, genuegt hier eine 1.
DeleteFetchedJunk=0


; --- Von Gregor verlangt, 11.09.2026 -----------------------------------------
;
; "die breite der linken spalte beim filter wird nicht ueber den neustart
; gespeichert." Ursache: bei UseMyFilterWindowPosition=0 zieht Eudora die
; gespeicherte Breite auf mindestens max(140, Fensterbreite/4) hoch
; (FiltersWazooWnd.cpp:176-181). Wer die Spalte schmaler haben will als ein
; Viertel des Fensters, bekommt sie nach jedem Neustart wieder breiter.
;
; Bei 1 gilt die Breite des Anwenders unveraendert. Gemessen an vier
; aufeinanderfolgenden Laeufen: 543 -> 543 und 334 -> 334, obwohl sich die
; Fensterbreite jedes Mal aenderte.
;
; ACHTUNG, DER ABSCHNITT IST WICHTIG. Eudora ordnet jeden Schluessel allein
; nach seiner internen Nummer einem Abschnitt zu (rs.cpp:88, GetSectionID):
; 10900 bis 11100 gehoeren nach [Window Position], alles andere nach
; [Settings]. UseMyFilterWindowPosition hat die Nummer 10922. In [Settings]
; wuerde der Eintrag stillschweigend ignoriert.
[Window Position]
UseMyFilterWindowPosition=1
