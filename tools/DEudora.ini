; DEudora.ini - Vorgaben fuer NEUE Konten
;
; Diese Datei liegt neben Eudora.exe. Eudora liest sie in
; GetDefaultIniSetting (Eudora71/Eudora/rs.cpp:357-385) und nimmt die Werte
; hier VOR den eingebauten Vorgaben aus EudoraRes.rc. Gesetzt wird der Pfad in
; SetupINIFilename (rs.cpp:1359-1368): Verzeichnis der EXE plus "DEudora.ini";
; fehlt die Datei, bleibt alles beim eingebauten Wert.
;
; WICHTIG - was diese Datei NICHT tut: sie aendert kein bestehendes Konto.
; Die Werte greifen genau einmal, wenn ein Konto ANGELEGT wird
; (CPersParams::GetDefaultParams, Eudora71/Eudora/PersParams.cpp:195, gerufen
; aus AccountWizard/Src/WizardPropSheet.cpp:137). Danach steht der Wert in der
; Eudora.ini des Mailverzeichnisses unter dem Namen des Kontos und wird von
; dort gelesen. Ein schon vorhandenes Konto muss man einmal von Hand umstellen.
;
; Angelegt am 07.09.2026 auf Gregors Ansage: "die zwei markierte dinge moechte
; ich als default bei jedem konto. zum testen ist es wichtig, sonst werden die
; mails abgerufen und geloescht, wenn ich nicht dran denke."

[Settings]

; --- Von Gregor ausdruecklich verlangt ---------------------------------------

; "Secure Sockets when Sending" -> "Required, Alternate Port" (SMTP ueber 465).
; Die Werte sind die Reihenfolge im Auswahlfeld, siehe
; SSLSettings::SSLUsage in Eudora71/Eudora/SSLSettings.h:30-36 und
; ModifyAcctDlgs.cpp:803-806:
;   0 = Never
;   1 = If Available, STARTTLS   <- war die eingebaute Vorgabe
;   2 = Required, Alternate Port <- das hier
;   3 = Required, STARTTLS
SSLSendUse=2

; "Check Mail" angehakt. Der eingebaute Wert ist schon 1
; (EudoraRes.rc: CheckMailByDefault\n1); er steht hier trotzdem, damit die
; Vorgabe an einer Stelle nachlesbar ist und ein spaeterer Eingriff in die
; Ressourcen sie nicht unbemerkt umdreht.
CheckMailByDefault=1

; --- Dasselbe fuer den Abruf, aus demselben Grund ----------------------------

; "Secure Sockets when Receiving" -> "Required, Alternate Port" (POP3 ueber
; 995). Genau diese Einstellung ist der Beleg fuer Kriterium 3 in ZIEL.md:
; gemessen am 06.09.2026 gegen mx.freenet.de, TLSv1.3,
; TLS_AES_256_GCM_SHA384. Die eingebaute Vorgabe war 1 (STARTTLS auf 110).
SSLReceiveUse=2

; --- Das, was Gregors Begruendung wirklich trifft ----------------------------

; "Leave mail on server". OHNE diesen Wert loescht Eudora eine Nachricht auf
; dem Server, sobald sie abgeholt ist - das ist der Fall, den Gregor
; beschreibt: "sonst werden die mails abgerufen und geloescht, wenn ich nicht
; dran denke". Die eingebaute Vorgabe ist 0
; (EudoraRes.rc: LeaveMailOnServer\n0), also loeschen.
;
; Die beiden Werte, nach denen Gregor gezeigt hat, verhindern das NICHT: "Check
; Mail" schaltet den Abruf ein, und die SSL-Wahl betrifft nur die Verbindung.
; Wer die Testmails behalten will, braucht diese Zeile. Soll sie weg, genuegt
; ein Semikolon davor.
LeaveMailOnServer=1

; Dazu die beiden Nachbarn, die das Loeschen auf anderen Wegen wieder
; einschalten wuerden - ausdruecklich aus:
;   LeaveOnServerDays  "nach N Tagen vom Server loeschen", 0 = nie
;   ServerDelete       "Delete from server when emptied from Trash"
LeaveOnServerDays=0
ServerDelete=0
